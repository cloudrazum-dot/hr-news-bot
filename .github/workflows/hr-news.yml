name: HR News Bot

on:
  schedule:
    - cron: '0 4,14 * * *'   # 04:00 и 14:00 UTC = ~08:00 и ~18:00 по Дубаю
  workflow_dispatch:          # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install helpers
        run: pip install requests

      - name: Run the bot
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hr_news_bot.py
      - name: Remember what was sent
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Update seen news" || echo "Nothing to commit"
          git push || echo "Nothing to push"
